services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  eureka-server:
    build: ./microservices/platform/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"

  config-server:
    build: ./microservices/platform/config-server
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server

  product-service:
    build: ./microservices/product-service
    container_name: product-service
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
      - config-server
      - kafka
    environment:
      APP_SEED_DATA: "true"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - product-data:/app/data

  cart-service:
    build: ./microservices/cart-service
    container_name: cart-service
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
      - config-server
      - kafka
      - product-service
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCT_SERVICE_BASE_URL: http://product-service:8081
      CART_DB_PATH: /app/data/cartdb
    volumes:
      - cart-data:/app/data

  auth-service:
    build: ./microservices/auth-service
    container_name: auth-service
    ports:
      - "8086:8085"
    depends_on:
      - eureka-server
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      AUTH_DB_PATH: /app/data/authdb
    volumes:
      - auth-data:/app/data

  api-gateway:
    build: ./microservices/platform/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - product-service
      - cart-service
      - auth-service
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/

volumes:
  product-data:
  cart-data:
  auth-data:
